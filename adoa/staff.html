<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff | Hair Salon adoa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&family=Noto+Sans+JP:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --stone:#E9E3D8;
    --stone-deep:#DDD4C4;
    --ink:#2B211D;
    --ink-soft:#6B5F55;
    --wine:#6E2A3A;
    --brass:#A8875A;
    --paper:#F4F0E8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--stone);
    color:var(--ink);
    font-family:'Noto Sans JP', sans-serif;
    line-height:1.9;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:'Shippori Mincho', serif; color:var(--ink); }
  a{ color:inherit; text-decoration:none; }
  img{ max-width:100%; display:block; }
  .wrap{ max-width:1040px; margin:0 auto; padding:0 28px; }

  .topbar{
    position:sticky; top:0; z-index:30;
    background:rgba(233,227,216,.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid rgba(43,33,29,.1);
  }
  .topbar-inner{
    max-width:1040px; margin:0 auto; padding:16px 28px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand-mini-logo{ height:34px; width:auto; }
  .tel-mini{
    font-size:14px; letter-spacing:.04em;
    border:1px solid var(--ink); border-radius:999px;
    padding:8px 20px;
  }
  .back-link{ font-size:13px; color:var(--ink-soft); }

  .page-head{ padding:72px 0 56px; }
  .page-eyebrow{ color:var(--ink-soft); font-size:14px; letter-spacing:.14em; margin-bottom:18px; }
  .page-head h1{ font-size:clamp(40px,7vw,64px); font-weight:600; margin-bottom:20px; }
  .page-head p{ color:var(--ink-soft); max-width:34em; }

  .staff-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:2px;
    background:rgba(43,33,29,.12);
    padding-bottom:100px;
  }
  .staff-card{
    background:var(--paper);
    padding-bottom:22px;
  }
  .staff-photo{ aspect-ratio:1; overflow:hidden; margin-bottom:16px; }
  .staff-photo img{ width:100%; height:100%; object-fit:cover; }
  .staff-role{ font-size:12px; color:var(--wine); letter-spacing:.04em; padding:0 18px; margin-bottom:4px; }
  .staff-name{ font-family:'Shippori Mincho', serif; font-size:18px; padding:0 18px; }

  @media (max-width:760px){
    .staff-grid{ grid-template-columns:repeat(2,1fr); }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-inner">
      <img class="brand-mini-logo" src="adoa-images/logo.png" alt="Hair Salon adoa">
      <a class="tel-mini" href="tel:0428232127">0428-23-2127</a>
    </div>
  </div>

  <div class="wrap page-head">
    <a class="back-link" href="index.html">← TOPへ戻る</a>
    <div style="height:20px;"></div>
    <div class="page-eyebrow">Staff</div>
    <h1>スタッフ紹介</h1>
    <p>トップスタイリスト4名・スタイリスト1名・ジュニアスタイリスト2名・アイリスト3名、
    合計10名が在籍しています。</p>
  </div>

  <div class="staff-grid">
    <div class="staff-card">
      <div class="staff-photo"><img src="adoa-images/sawai.png" alt="sawai"></div>
      <div class="staff-role">トップスタイリスト</div>
      <div class="staff-name">sawai</div>
    </div>
    <div class="staff-card">
      <div class="staff-photo"><img src="adoa-images/iwata.png" alt="iwata"></div>
      <div class="staff-role">トップスタイリスト</div>
      <div class="staff-name">iwata</div>
    </div>
    <div class="staff-card">
      <div class="staff-photo"><img src="adoa-images/okabe.png" alt="okabe"></div>
      <div class="staff-role">トップスタイリスト</div>
      <div class="staff-name">okabe</div>
    </div>
    <div class="staff-card">
      <div class="staff-photo"><img src="adoa-images/adachi.png" alt="adachi"></div>
      <div class="staff-role">トップスタイリスト</div>
      <div class="staff-name">adachi</div>
    </div>
    <div class="staff-card">
      <div class="staff-photo"><img src="adoa-images/ikeda.png" alt="ikeda"></div>
      <div class="staff-role">スタイリスト</div>
      <div class="staff-name">ikeda</div>
    </div>
    <div class="staff-card">
      <div class="staff-photo"><img src="adoa-images/shimazaki.png" alt="shimazaki"></div>
      <div class="staff-role">ジュニアスタイリスト</div>
      <div class="staff-name">shimazaki</div>
    </div>
    <div class="staff-card">
      <div class="staff-photo"><img src="adoa-images/suzuki.png" alt="suzuki"></div>
      <div class="staff-role">ジュニアスタイリスト</div>
      <div class="staff-name">suzuki</div>
    </div>
    <div class="staff-card"></div>
    <div class="staff-card">
      <div class="staff-photo"><img src="adoa-images/endo.png" alt="endo"></div>
      <div class="staff-role">アイリスト&エステ</div>
      <div class="staff-name">endo</div>
    </div>
    <div class="staff-card">
      <div class="staff-photo"><img src="adoa-images/ishida.png" alt="ishida"></div>
      <div class="staff-role">アイリスト</div>
      <div class="staff-name">ishida</div>
    </div>
    <div class="staff-card">
      <div class="staff-photo"><img src="adoa-images/narumi.png" alt="narumi"></div>
      <div class="staff-role">アイリスト</div>
      <div class="staff-name">narumi</div>
    </div>
  </div>

</body>
</html>
